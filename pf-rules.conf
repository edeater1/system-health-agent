# ═══════════════════════════════════════════════════════════════
# System Health Agent — pf Firewall Rules
# ═══════════════════════════════════════════════════════════════
# Smart protection: blocks dangerous access, keeps Apple ecosystem working.
# AirDrop, AirPlay, Finder sharing, Handoff all work normally.
# Load with: sudo pfctl -f /path/to/pf-rules.conf -e
# ═══════════════════════════════════════════════════════════════

# ── Tables ──
table <trusted> persist
table <blocked> persist

# ── Options ──
set skip on lo0
set block-policy drop
set state-policy if-bound

# ── Normalization ──
scrub in all

# ── Block known bad IPs immediately ──
block in quick from <blocked>

# ── Allow all outgoing (your apps need internet) ──
pass out all keep state

# ── Allow return traffic for connections YOU started ──
pass in quick proto { tcp, udp } from any to any keep state

# ── Allow trusted IPs fully ──
pass in quick from <trusted>

# ── Apple ecosystem (AirDrop, AirPlay, Bonjour, Handoff) ──
# mDNS/Bonjour — device discovery on local network
pass in quick proto udp from any to 224.0.0.251 port 5353
# AirPlay (ControlCenter ports)
pass in quick proto tcp from 192.168.0.0/16 to any port { 5000, 7000 }
pass in quick proto tcp from 10.0.0.0/8 to any port { 5000, 7000 }
pass in quick proto tcp from 172.16.0.0/12 to any port { 5000, 7000 }
# AWDL (AirDrop uses its own WiFi Direct interface)
set skip on awdl0
# Rapportd (Apple device-to-device communication)
pass in quick proto tcp from 192.168.0.0/16 to any port 49152:65535
pass in quick proto tcp from 10.0.0.0/8 to any port 49152:65535
pass in quick proto tcp from 172.16.0.0/12 to any port 49152:65535

# ── Essential network services ──
# DNS
pass in quick proto udp from any to any port 53
# DHCP
pass in quick proto udp from any port 67:68 to any port 67:68

# ── BLOCK dangerous remote access ports from OUTSIDE your network ──
# These are the ports attackers target — always blocked from the internet
block in quick proto tcp from ! 192.168.0.0/16 to any port 22
block in quick proto tcp from ! 10.0.0.0/8 to any port 22
block in quick proto tcp from any to any port { 3283, 5900, 5988, 5989 }

# ── Rate limiting: prevent brute force attacks ──
# If any IP tries >50 connections or >15 new connections in 5 seconds,
# it gets auto-blocked and all its connections are dropped
pass in proto tcp from any to any flags S/SA keep state \
  (max-src-conn 50, max-src-conn-rate 15/5, overload <blocked> flush global)

# ── Default: allow remaining traffic through (firewall app handles per-app) ──
pass in all
